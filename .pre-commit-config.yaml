# Pre-commit hooks for Voice SRS.
#
# This file only DECLARES hooks; it does NOT install them. Linked worktrees share
# a single .git/hooks directory, so hooks are intentionally not installed here.
#
# Hook installation is deferred until after publication cleanup. For manual use on
# any checkout:
#   pre-commit install        # once, on a personal checkout (do not on shared worktrees)
#   pre-commit run --all-files
#
# Hooks:
#   gitleaks/gitleaks v8.30.1   full-history secret scan (--redact=100)
#   pre-commit/pre-commit-hooks v5.0.0
#     - detect-private-key
#     - check-added-large-files (1024 KB)
#     - check-merge-conflict
#     - check-yaml

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact=100"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--max-size=1024"]
      - id: check-merge-conflict
      - id: check-yaml
