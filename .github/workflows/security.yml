name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history without saved credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks full-history scan
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/voice-srs-gitleaks"
          mkdir -p "$work"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/$asset" -o "$work/$asset"
          curl --fail --silent --show-error --location "$base/$sums" -o "$work/$sums"
          (cd "$work"; awk -v file="$asset" '$2 == file {print}' "$sums" > selected.sha256; test -s selected.sha256; sha256sum --check selected.sha256)
          tar -xzf "$work/$asset" -C "$work" gitleaks
          "$work/gitleaks" git --config=.gitleaks.toml --redact=100 --log-opts=--all

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Only debug runtime dependencies are audited, not every build/test/addon dependency.
      - name: Generate resolved runtime dependency lock
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath \
            --write-locks --init-script tools/security/locks.init.gradle --no-daemon
          test -s app/gradle.lockfile

      - name: OSV resolved runtime dependency audit
        env:
          OSV_VERSION: 2.7.0
        # Use the binary directly so missing-lockfile and other scanner errors
        # retain their nonzero exit status rather than being normalized by a wrapper.
        run: |
          set -euo pipefail
          test -s app/gradle.lockfile
          work="$RUNNER_TEMP/voice-srs-osv"
          mkdir -p "$work"
          asset="osv-scanner_linux_amd64"
          sums="osv-scanner_SHA256SUMS"
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
          curl --fail --silent --show-error --location "$base/$asset" -o "$work/$asset"
          curl --fail --silent --show-error --location "$base/$sums" -o "$work/$sums"
          (cd "$work"; awk -v file="$asset" '$2 == file {print}' "$sums" > selected.sha256; test -s selected.sha256; sha256sum --check selected.sha256)
          chmod +x "$work/$asset"
          "$work/$asset" scan source --lockfile=app/gradle.lockfile
