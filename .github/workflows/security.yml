name: security

# Audit secrets (full history) and resolved runtime dependencies.
on:
  push:
  pull_request:

# Least privilege: only read access needed for scanning.
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java 17 + Android SDK 36 mirror the existing android workflow; needed to
      # resolve and write the Gradle dependency lock.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --- Resolved runtime dependency lock (OSV-Scanner input) -------------
      # This audits the RESOLVED runtime dependencies, NOT every build/test/
      # vendored dependency.
      - name: Generate resolved runtime dependency lock
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath \
            --write-locks --init-script tools/security/locks.init.gradle --no-daemon

      - name: Ensure dependency lockfile exists and is non-empty
        run: |
          test -s app/gradle.lockfile || { echo "app/gradle.lockfile is missing or empty" >&2; exit 1; }
          echo "app/gradle.lockfile present ($(wc -c < app/gradle.lockfile) bytes)"

      # --- Secret scan (full history) ---------------------------------------
      - name: Download gitleaks v8.30.1 (Linux x64)
        env:
          GITLEAKS_VERSION: v8.30.1
        run: |
          set -euo pipefail
          VER="$GITLEAKS_VERSION"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/$VER"
          TARBALL="gitleaks_linux_amd64.tar.gz"
          curl -fsSL -o "$TARBALL" "$BASE/$TARBALL"
          curl -fsSL -o gitleaks_sha256sums "$BASE/gitleaks_sha256sums"
          echo "Downloaded $TARBALL and gitleaks_sha256sums"

      - name: Verify gitleaks release checksum
        run: |
          set -euo pipefail
          # gitleaks_sha256sums lists every asset; check only the x64 tarball we downloaded.
          grep 'gitleaks_linux_amd64.tar.gz$' gitleaks_sha256sums | sha256sum -c -

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tar -xzf gitleaks_linux_amd64.tar.gz
          chmod +x gitleaks
          ./gitleaks version

      - name: Gitleaks full-history scan
        # No continue-on-error: a real secret must fail the build.
        run: ./gitleaks git --redact=100 --log-opts=--all

      # --- Vulnerability scan of resolved runtime dependencies --------------
      # Pinned action + version; no continue-on-error: audit errors must fail.
      - name: OSV-Scanner resolved runtime dependency audit
        uses: google/osv-scanner-action/osv-scanner-action@0a65f82af05cd58cf587827b0bb0489548c18346
        with:
          version: v2.7.0
          scan-args: "scan source --lockfile=app/gradle.lockfile"
